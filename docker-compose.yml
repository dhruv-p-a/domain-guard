version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: domainguard_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/domainguard
      - SECRET_KEY=super-secret-key-change-in-production-domainguard-2026
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-mock_client_id}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-mock_client_secret}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-mock_webhook_secret}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: domainguard_celery_worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/domainguard
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: domainguard_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=domainguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: domainguard_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
